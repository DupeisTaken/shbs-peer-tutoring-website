name: Build and publish image

on:
  push:
    branches: [main]
  # Validate stacked feature PRs as well as PRs targeting main. Without a base filter, every
  # pull-request layer runs the same migration, static-analysis, test, and production-build gate.
  pull_request:
  workflow_dispatch:

# A newer run for the same PR or ref cancels older verification/publish work before it can
# promote stale code to the mutable GHCR `latest` tag. The publish job also rechecks main below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Match the integration suite's dedicated-database safety guard.
          POSTGRES_DB: shbs_shipping_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shbs_shipping_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shbs_shipping_test
      AUTH_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:migrate
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run check
      - run: npm run docs:check
      # Protect developer tooling as well as the pruned production dependency graph.
      - run: npm audit
      - run: npm test
      - run: npm run build

      # Build success alone does not exercise Prisma's runtime dependency graph or entrypoint.
      - uses: docker/setup-buildx-action@v3
      - name: Build runnable image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shbs-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot image with an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shbs_boot_test
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres shbs_boot_test
          bash scripts/smoke-image.sh shbs-smoke:local

  publish:
    needs: verify
    # Only main is publishable. Manual dispatch remains useful for a selected main commit, but a
    # stale selection fails the current-main check immediately before the image push.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # A run can finish verification after a newer main commit landed. Fail closed instead of
      # letting that older checkout overwrite the mutable `latest` tag.
      - name: Confirm commit is current main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$current_sha" || "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Refusing to publish stale commit $EXPECTED_SHA; origin/main is $current_sha."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
