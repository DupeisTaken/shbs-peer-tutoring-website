name: Build and publish image

on:
  push:
    branches: [main]
  # Validate stacked feature PRs as well as PRs targeting main. Without a base filter, every
  # pull-request layer runs the same migration, static-analysis, test, and production-build gate.
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Match the integration suite's dedicated-database safety guard.
          POSTGRES_DB: shbs_survey_first_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shbs_survey_first_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shbs_survey_first_test
      AUTH_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build

      # Build success alone does not exercise Prisma's runtime dependency graph or entrypoint.
      - uses: docker/setup-buildx-action@v3
      - name: Build runnable image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shbs-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot image with an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shbs_boot_test
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres shbs_boot_test
          bash scripts/smoke-image.sh shbs-smoke:local

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
