name: Scheduling request profile

on:
  pull_request:
    paths:
      - ".github/workflows/scheduling-profile.yml"
      - ".github/workflows/scheduling-profile-worker.yml"
      - ".github/scheduling-profile-manifests/**"
      - "scripts/profile-scheduling-requests.ts"
      - "scripts/scheduling-profile/**"
      - "scripts/run-scheduling-profile-ci.sh"
      - "src/server/session-planning/**"
      - "src/server/room-allocation.ts"
      - "src/server/ordered-pairing-release.ts"
      - "src/server/bulk-room-allocation.ts"
      - "src/server/api/routers/admin.ts"
      - "src/server/api/routers/tutor.ts"
      - "src/server/database-options.ts"
      - "src/lib/program-time.ts"
      - "src/lib/school-calendar.ts"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Immutable 40-character baseline commit SHA"
        required: true
        type: string
      schema-manifest:
        description: "Optional exact reviewed manifest under .github/scheduling-profile-manifests/"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: scheduling-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      preflight: ${{ steps.plan.outputs.preflight }}
      anchor: ${{ steps.plan.outputs.anchor }}
      node_image: ${{ steps.plan.outputs.node_image }}
      baseline: ${{ steps.selection.outputs.baseline }}
      manifest: ${{ steps.selection.outputs.manifest }}
      baseline_path: ${{ steps.selection.outputs.baselineSelectionPath }}
      baseline_file_sha256: ${{ steps.selection.outputs.baselineSelectionFileSha256 }}
      baseline_source: ${{ steps.selection.outputs.baselineSelectionSource }}
      catalog_baseline: ${{ steps.selection.outputs.catalogBaseline }}
      catalog_path: ${{ steps.selection.outputs.catalogBaselineSelectionPath }}
      catalog_file_sha256: ${{ steps.selection.outputs.catalogBaselineSelectionFileSha256 }}
      catalog_source: ${{ steps.selection.outputs.catalogBaselineSelectionSource }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select immutable comparison and reviewed schema contract
        id: selection
        env:
          DEFAULT_BASELINE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_BASELINE_SHA: ${{ inputs.baseline || '' }}
          MANUAL_SCHEMA_MANIFEST: ${{ inputs.schema-manifest || '' }}
        run: node scripts/scheduling-profile/select-comparison.mjs . >> "$GITHUB_OUTPUT"
      - name: Fix the sample population and shared clock
        id: plan
        shell: bash
        run: |
          echo "preflight=$(node scripts/scheduling-profile/aggregate-partitions.mjs --matrix preflight)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node scripts/scheduling-profile/aggregate-partitions.mjs --matrix remaining)" >> "$GITHUB_OUTPUT"
          echo "anchor=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"
          timeout 60 docker pull node:22-alpine
          echo "node_image=$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
      - name: Validate helpers under the measurement resource limits
        env:
          PROFILE_NODE_IMAGE: ${{ steps.plan.outputs.node_image }}
        run: |
          docker run --rm --cpus=2 --memory=4g -v "$PWD:/work" -w /work \
            "$PROFILE_NODE_IMAGE" sh -ec 'npm ci --ignore-scripts && node --import tsx --test --test-concurrency=1 scripts/scheduling-profile/*.test.ts'
  preflight:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.preflight) }}
    uses: ./.github/workflows/scheduling-profile-worker.yml
    with:
      baseline: ${{ matrix.scenario == 'catalog' && needs.matrix.outputs.catalog_baseline || needs.matrix.outputs.baseline }}
      candidate: ${{ github.event.pull_request.head.sha || github.sha }}
      scenario: ${{ matrix.scenario }}
      mode: ${{ matrix.mode }}
      partition: ${{ matrix.partition }}
      partition-count: ${{ matrix.partitionCount }}
      samples: ${{ matrix.samples }}
      anchor: ${{ needs.matrix.outputs.anchor }}
      node-image: ${{ needs.matrix.outputs.node_image }}
      schema-manifest: ${{ needs.matrix.outputs.manifest }}
      baseline-selection-path: ${{ matrix.scenario == 'catalog' && needs.matrix.outputs.catalog_path || needs.matrix.outputs.baseline_path }}
      baseline-selection-file-sha256: ${{ matrix.scenario == 'catalog' && needs.matrix.outputs.catalog_file_sha256 || needs.matrix.outputs.baseline_file_sha256 }}
      baseline-selection-source: ${{ matrix.scenario == 'catalog' && needs.matrix.outputs.catalog_source || needs.matrix.outputs.baseline_source }}
  profile:
    needs: [matrix, preflight]
    strategy:
      fail-fast: false
      # Independent hosted runners own separate databases. Each before/after
      # pair remains serial on its same runner with fixed resource limits.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    uses: ./.github/workflows/scheduling-profile-worker.yml
    with:
      baseline: ${{ matrix.scenario == 'catalog' && needs.matrix.outputs.catalog_baseline || needs.matrix.outputs.baseline }}
      candidate: ${{ github.event.pull_request.head.sha || github.sha }}
      scenario: ${{ matrix.scenario }}
      mode: ${{ matrix.mode }}
      partition: ${{ matrix.partition }}
      partition-count: ${{ matrix.partitionCount }}
      samples: ${{ matrix.samples }}
      anchor: ${{ needs.matrix.outputs.anchor }}
      node-image: ${{ needs.matrix.outputs.node_image }}
      schema-manifest: ${{ needs.matrix.outputs.manifest }}
      baseline-selection-path: ${{ matrix.scenario == 'catalog' && needs.matrix.outputs.catalog_path || needs.matrix.outputs.baseline_path }}
      baseline-selection-file-sha256: ${{ matrix.scenario == 'catalog' && needs.matrix.outputs.catalog_file_sha256 || needs.matrix.outputs.baseline_file_sha256 }}
      baseline-selection-source: ${{ matrix.scenario == 'catalog' && needs.matrix.outputs.catalog_source || needs.matrix.outputs.baseline_source }}

  aggregate:
    needs: [matrix, preflight, profile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      BASELINE_SHA: ${{ needs.matrix.outputs.baseline }}
      CATALOG_BASELINE_SHA: ${{ needs.matrix.outputs.catalog_baseline }}
      CATALOG_SELECTION_SOURCE: ${{ needs.matrix.outputs.catalog_source }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      PROFILE_RESULT: ${{ needs.profile.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: scheduling-profile-*-part-*-${{ github.run_attempt }}
          path: outputs/scheduling-profile-parts
      - name: Require complete paired populations before pooling
        shell: bash
        run: |
          catalog_args=()
          if [[ "$CATALOG_SELECTION_SOURCE" == "reviewed-pr-catalog-baseline-file" ]]; then
            catalog_args=(--catalog-baseline "$CATALOG_BASELINE_SHA")
          fi
          node scripts/scheduling-profile/aggregate-partitions.mjs \
            --input outputs/scheduling-profile-parts \
            --baseline "$BASELINE_SHA" --candidate "$CANDIDATE_SHA" "${catalog_args[@]}" \
            --output outputs/scheduling-profile-aggregate.json
      - name: Require every diagnostic and latency partition
        if: always()
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$PROFILE_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduling-profile-aggregate-${{ github.run_attempt }}
          path: outputs/scheduling-profile-aggregate.json
          retention-days: 7
          if-no-files-found: error
