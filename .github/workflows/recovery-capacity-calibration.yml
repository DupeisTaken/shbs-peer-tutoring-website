name: Recovery fixture timing calibration
'on':
  push:
    branches:
      - codex/calibrate-recovery-capacity-493
permissions:
  contents: read
jobs:
  calibrate:
    name: Sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sample:
          - 1
          - 2
          - 3
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shbs_shipping_test
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U postgres -d shbs_shipping_test" --health-interval 10s --health-timeout 5s --health-retries 5'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shbs_shipping_test
      AUTH_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to isolated database
        run: npm run db:migrate
      - name: Check migration and schema agreement
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Measure the complete modified suites on one worker
        run: npm test -- --run src/server/person-history-correction.test.ts src/server/person-partition.test.ts src/server/api/routers/room-allocation.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile.json=.validation/test-results.json
      - name: Record tested source and runner
        if: always()
        run: |-
          mkdir -p .validation
          git rev-parse HEAD > .validation/source.txt
          node --version > .validation/node-version.txt
          printf "%s\n" "$ImageOS" "$ImageVersion" "$RUNNER_ARCH" > .validation/runner.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-sample-${{ matrix.sample }}-${{ github.run_attempt }}
          path: |-
            .validation/test-results.json
            .validation/source.txt
            .validation/node-version.txt
            .validation/runner.txt
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
