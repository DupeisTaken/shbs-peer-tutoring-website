name: Enhance an existing feature
description: Suggest an improvement to a feature that already exists.
title: "[Enhancement]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to improve an existing feature. Use the bug report for behavior that does not work as expected, or the feature suggestion for a new capability.
        Keep examples anonymous. A proposed program-policy change needs management agreement as well as software changes.
  - type: input
    id: feature
    attributes:
      label: Which existing feature should be improved?
      description: Include the feature name and page or workflow where you use it.
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior and limitations
      description: Describe how the feature works today, who uses it and what makes it difficult or less useful.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement and desired outcome
      description: Explain what should change, how it would help and how we could tell the improvement works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Optional. Include simpler options and any important tradeoffs.
  - type: textarea
    id: constraints
    attributes:
      label: Existing behavior to preserve or constraints
      description: Optional. Mention effects on other roles, existing records, approval or privacy, and any program decisions that need confirmation.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: My examples contain no private participant data or account credentials.
          required: true
