name: Suggest a feature
description: Explain a user problem and the outcome you want.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need first. You do not need to design the implementation.
        Keep examples anonymous. A proposed program-policy change needs management agreement as well as software changes.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Say who encounters it, in which role, and where in their workflow.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what a user should be able to do and how we could tell it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Optional. Include simpler options and any important tradeoffs.
  - type: textarea
    id: decisions
    attributes:
      label: Program decisions or constraints
      description: Optional. Identify expectations that still need confirmation, such as approval, privacy or service-hour rules.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: My examples contain no private participant data or account credentials.
          required: true
